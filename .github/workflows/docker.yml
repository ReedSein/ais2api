name: Container
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ais2api:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}
      - name: Smoke test image
        run: |
          set -eu
          data="$RUNNER_TEMP/ais2api-data"
          mkdir -p "$data"
          docker run --rm --entrypoint /app/bin/ais2api \
            -v "$data:/data" ais2api:ci \
            init --config /data/config.json --data-dir /data \
            --bind 0.0.0.0 --browser /usr/bin/chromium
          docker run --rm --entrypoint /app/bin/ais2api \
            -v "$data:/data" ais2api:ci \
            doctor --config /data/config.json > "$RUNNER_TEMP/doctor.json"
          cat "$RUNNER_TEMP/doctor.json"
          grep -q '"browser_exists":true' "$RUNNER_TEMP/doctor.json"
          docker run --rm --entrypoint /usr/bin/chromium ais2api:ci \
            --no-sandbox --headless=new --disable-gpu --disable-dev-shm-usage \
            --dump-dom about:blank | grep -q '<html'
          docker run --rm --entrypoint /bin/sh ais2api:ci -c '
            set -eu
            profile=$(mktemp -d)
            /usr/bin/chromium --no-sandbox --headless=new --disable-gpu \
              --disable-dev-shm-usage --remote-debugging-address=127.0.0.1 \
              --remote-debugging-port=0 --user-data-dir="$profile" about:blank \
              >/tmp/chromium.log 2>&1 &
            pid=$!
            trap "kill $pid 2>/dev/null || true" EXIT
            for _ in $(seq 1 30); do
              [ -f "$profile/DevToolsActivePort" ] && break
              sleep 1
            done
            if [ ! -f "$profile/DevToolsActivePort" ]; then cat /tmp/chromium.log; exit 1; fi
            port=$(sed -n 1p "$profile/DevToolsActivePort")
            curl -fsS "http://127.0.0.1:$port/json/version"
          '
          docker run -d --name ais2api-smoke \
            -p 18452:18451 -v "$data:/data" ais2api:ci
          trap 'docker logs ais2api-smoke; docker rm -f ais2api-smoke' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18452/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18452/health
          curl -fsS http://127.0.0.1:18452/ | grep -q 'id="app"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18452/ready)" = 503
          docker stop -t 30 ais2api-smoke
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          printf '%s\n' "${{ steps.meta.outputs.tags }}" | while IFS= read -r tag; do
            [ -z "$tag" ] || docker push "$tag"
          done
